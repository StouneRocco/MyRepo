name: Tests et compilation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt -r projector-pi/requirements.txt
      - run: python -m unittest discover -s backend -p 'test_*.py'
      - run: python -m unittest discover -s projector-pi -p 'test_*.py'
      - run: npm ci && npm test && npm run build
        working-directory: frontend
